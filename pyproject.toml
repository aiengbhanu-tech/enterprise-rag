[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-lab"
version = "0.1.0"
description = "Permission-aware hybrid retrieval and reproducible evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdf>=5,<7"]

[project.optional-dependencies]
models = ["sentence-transformers>=3.4,<6"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"rag/api.py" = ["B008"] # FastAPI dependency declarations intentionally use Depends defaults.
